{% extends 'crawler/base.html' %}

{% block title %}Connexion - WebCrawler SaaS{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">🔐 Connexion</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            <strong>Erreur:</strong> Nom d'utilisateur ou mot de passe incorrect.
                        </div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Nom d'utilisateur</label>
                        <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>
                    
                    <input type="hidden" name="next" value="{{ next }}">
                    
                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                </form>
                
                <hr>
                
                <p class="text-center mb-0">
                    Pas encore de compte ? <a href="{% url 'register' %}">S'inscrire</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
