{% extends 'crawler/base.html' %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="narrow">
  <form method="post" class="window" novalidate>
    {% csrf_token %}
    <h1 class="window__title">Se connecter</h1>

    {% if form.non_field_errors %}
      <ul class="form-errors">{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>
    {% endif %}

    <div class="field">
      <label for="id_username">Nom d'utilisateur</label>
      <input type="text" name="username" id="id_username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    </div>
    <div class="field">
      <label for="id_password">Mot de passe</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Se connecter</button>

    <p class="form-foot">Pas encore de compte ? <a href="{% url 'register' %}">Créer un compte</a></p>
  </form>
</div>
{% endblock %}
