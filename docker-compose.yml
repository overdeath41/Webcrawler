# WebCrawler SaaS — pile applicative.
# nginx n'est PAS ici : c'est le nginx de l'hôte Ubuntu qui publie le site sur
# le port 80 et relaie vers Gunicorn (127.0.0.1:${APP_PORT}). Aucun autre port
# n'est exposé : PostgreSQL et Redis restent dans le réseau Docker interne.

x-app: &app
  build: .
  image: webcrawler-saas:latest
  env_file: .env
  environment:
    DB_ENGINE: django.db.backends.postgresql
    DB_HOST: db
    DB_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    MEDIA_ROOT: /app/webcrawler_saas/media
  volumes:
    - media_data:/app/webcrawler_saas/media
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-webcrawler}
      POSTGRES_USER: ${DB_USER:-webcrawler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  web:
    <<: *app
    command: /app/docker/entrypoint.web.sh
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"   # joignable uniquement depuis l'hôte (nginx)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *app
    command: /app/docker/entrypoint.worker.sh
    # Scrapy consomme de la RAM : garde-fou pour ne pas gêner les autres services du serveur
    mem_limit: ${WORKER_MEM_LIMIT:-2g}

  beat:
    <<: *app
    command: celery -A webcrawler_saas beat -l info --schedule /tmp/celerybeat-schedule
    volumes: []

volumes:
  postgres_data:
  redis_data:
  media_data:
